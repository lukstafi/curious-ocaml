<text x="40" y="84" fill="#193442" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Input moves: 1, 1, 0, -1, then ten zeros. Start: ball (5,2), paddle 5.</text>
