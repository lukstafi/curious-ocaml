<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
<title id="title">One search tree, three observations</title>
<desc id="desc">pairs 4 chooses x and y from 1,2,3 and retains x+y=4. Of nine leaves, (1,3), (2,2), and (3,1) succeed. All returns those three pairs in that order, first returns Some(1,3), and count returns 3. All other leaves fail.</desc>
