<text x="40" y="45" fill="#193442" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">One search tree, three observations</text>
<text x="40" y="83" fill="#193442" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">pairs 4: choose x, choose y, then keep x + y = 4.</text>
