<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" role="img" aria-labelledby="title desc">
<title id="title">One recorded input, the same observable trace</title>
<desc id="desc">Four snapshots are selected from the common game trace: tick 2 has ball (7,0) and a paddle collision; tick 5 has (10,3) and a wall collision; tick 8 has (7,6) and a ceiling collision; tick 14 has (1,0) and a miss. Streams, incremental signals and effects all produce the entire identical fourteen-tick trace; the drawing shows only these four event ticks.</desc>
